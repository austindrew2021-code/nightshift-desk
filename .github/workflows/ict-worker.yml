name: ict-worker
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "1-59/5 * * * *"
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/ict-worker.mts
      - .github/workflows/ict-worker.yml
      - src/lib/engine/**
      - src/lib/market/**
permissions:
  contents: write
concurrency:
  group: ict-worker
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          path: src-tree
      - uses: actions/checkout@v4
        with:
          ref: ict-live
          path: live-data
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src-tree/package-lock.json
      - name: install
        working-directory: src-tree
        run: npm ci
      - name: hunt ~1m for 6 ticks
        env:
          ICT_STATE_PATH: ${{ github.workspace }}/live-data/ict-state.json
          ICT_START_USD: "100"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${{ github.workspace }}/live-data"
          cd "${{ github.workspace }}/live-data"
          git config user.name "nightshift-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d .git ]; then
            git init
            git checkout -B ict-live
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git checkout -B ict-live
          fi
          cd "${{ github.workspace }}/src-tree"
          for i in 1 2 3 4 5 6; do
            echo "tick $i"
            npx tsx scripts/ict-worker.mts || true
            cd "${{ github.workspace }}/live-data"
            git add ict-state.json ict-klines.json ict-last.json || true
            if ! git diff --cached --quiet; then
              git commit -m "ict tick $(date -u +%H:%M:%S) #$i"
              git pull --rebase origin ict-live || git pull --rebase --autostash origin ict-live || true
              git push -u origin HEAD:ict-live || true
            fi
            cd "${{ github.workspace }}/src-tree"
            if [ "$i" -lt 6 ]; then sleep 45; fi
          done
