name: ict-last
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "1-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ict-last
  cancel-in-progress: true
jobs:
  last:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src-tree
      - uses: actions/checkout@v4
        with:
          ref: ict-live
          path: live-data
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src-tree/package-lock.json
      - name: install
        working-directory: src-tree
        run: npm ci
      - name: last
        working-directory: src-tree
        env:
          ICT_LAST_PATH: ${{ github.workspace }}/live-data/ict-last.json
        run: |
          mkdir -p "${{ github.workspace }}/live-data"
          npx tsx scripts/ict-last.mts
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: live-data
        run: |
          git config user.name "nightshift-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -B ict-live
          git add ict-last.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "ict last $(date -u +%H:%M)"
          git pull --rebase origin ict-live || true
          git push -u origin HEAD:ict-live
